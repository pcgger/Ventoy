name: VtoyMac kext

on:
  push:
    branches: ['**']   # without this, a push filter that lists tags only fires on tag pushes
    paths: ['MacOS/**', '.github/workflows/vtoymac.yml']
    tags: ['vtoymac-*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  kext:
    # Apple-silicon runner cross-compiling for x86_64 (Intel runners queue for a long time).
    # The kernel dependency check (kmutil libraries) was done once on macos-15-intel: IOStorageFamily,
    # kpi.iokit, kpi.libkern - re-run it there when adding new kernel APIs.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build kext
        working-directory: MacOS/VtoyMac
        run: |
          xcodebuild -version
          make
          file build/VtoyMac.kext/Contents/MacOS/VtoyMac
          nm -u build/VtoyMac.kext/Contents/MacOS/VtoyMac
          plutil -lint build/VtoyMac.kext/Contents/Info.plist
          # OpenCore (and the kernel) need _kmod_info; without it injection fails with "Invalid Parameter"
          nm build/VtoyMac.kext/Contents/MacOS/VtoyMac | grep -E ' [DS] _kmod_info$'
      - name: Package
        run: |
          mkdir -p out
          ditto -c -k --keepParent MacOS/VtoyMac/build/VtoyMac.kext out/VtoyMac.kext.zip
      - uses: actions/upload-artifact@v4
        with:
          name: VtoyMac-kext
          path: out/

  efi:
    # VtoyBoot (UEFI app) and the SSDTs need no Mac.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang lld acpica-tools >/dev/null
      - name: Build VtoyBoot
        working-directory: MacOS/VtoyBoot
        run: |
          make CC=clang LD=lld-link
          file build/VtoyBoot.efi
          ls -l build/VtoyBoot.efi
      - name: Build SSDTs
        run: |
          iasl -v
          for f in MacOS/ACPI/*.dsl; do iasl -va "$f"; done
          ls -l MacOS/ACPI/*.aml
      - name: Package
        run: |
          mkdir -p out
          cp MacOS/ACPI/*.aml MacOS/VtoyBoot/build/VtoyBoot.efi out/
      - uses: actions/upload-artifact@v4
        with:
          name: VtoyBoot-ACPI
          path: out/
